name: gate0

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Gate-0 baseline
        run: |
          python scripts/check_gate0.py
          python scripts/check_gate0_r2.py
          python scripts/check_gate0_r3.py
          python scripts/check_toolchain_lock.py
          python scripts/check_runner_baseline.py
          python scripts/check_supported_runtime_bundle.py

      - name: Ensure repository has no whitespace errors
        run: git diff --check HEAD^ HEAD || git diff --check

  toolchain-realization:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin pip
        run: python -m pip install --disable-pip-version-check pip==26.2.1

      - name: Install reproducible toolchain
        run: |
          python -m pip install             --disable-pip-version-check             --no-input             -r requirements-lock.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Verify exact toolchain provenance
        run: python scripts/check_toolchain_lock.py --runtime

      - name: Smoke test GenLayer CLIs
        run: |
          pytest --version
          gltest --help >/tmp/gltest-help.txt
          genvm-lint --help >/tmp/genvm-lint-help.txt
          test -s /tmp/gltest-help.txt
          test -s /tmp/genvm-lint-help.txt


  canonical-contract-certification:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin pip
        run: python -m pip install --disable-pip-version-check pip==26.2.1

      - name: Install reproducible toolchain
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            -r requirements-lock.txt

      - name: Verify dependency and toolchain provenance
        run: |
          python -m pip check
          python scripts/check_toolchain_lock.py --runtime
          python scripts/check_runner_baseline.py

      - name: Download exact GenVM runner bundle
        run: genvm-lint download --version v0.2.16

      - name: Verify canonical implementation hashes
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              Path("contracts/aegis_core.py"): "df7f279e651681a24fdb3b0f71079edb64ebdf45a0e5c398806804f07fb3d21b",
              Path("contracts/aegis_digest_helper.py"): "624129618401b57c8547e6b4c4b14528fbce154a9f8e00a621596221b7864d73",
              Path("tests/test_aegis_core_direct.py"): "b3368fe053abe0fc1e2290b8b839f173b31e126ccc94a3e14ff3f2676962cab6",
              Path("tests/conftest.py"): "a5841fda3e29ec53714f0385ec5b217f19cb203a1ed19db89ad391e60f4c22d9",
          }

          for path, wanted in expected.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"{path} SHA256={actual}")
              if actual != wanted:
                  raise SystemExit(
                      f"SHA-256 mismatch for {path}"
                  )

          print("CANONICAL_IMPLEMENTATION_HASH_GATE=PASS")
          PY

      - name: Run canonical static certification
        env:
          GENVM_VERSION: v0.2.16
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail

          genvm-lint lint contracts/aegis_core.py
          genvm-lint validate contracts/aegis_core.py
          genvm-lint check contracts/aegis_core.py
          genvm-lint typecheck contracts/aegis_core.py --strict --json > /tmp/aegis-core-strict.json
          genvm-lint typecheck contracts/aegis_core.py
          genvm-lint schema contracts/aegis_core.py --output /tmp/aegis-core-abi.json

          genvm-lint lint contracts/aegis_digest_helper.py
          genvm-lint validate contracts/aegis_digest_helper.py
          genvm-lint check contracts/aegis_digest_helper.py
          genvm-lint typecheck contracts/aegis_digest_helper.py --strict --json > /tmp/aegis-helper-strict.json
          genvm-lint typecheck contracts/aegis_digest_helper.py
          genvm-lint schema contracts/aegis_digest_helper.py --output /tmp/aegis-helper-abi.json

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          strict_files = (
              Path("/tmp/aegis-core-strict.json"),
              Path("/tmp/aegis-helper-strict.json"),
          )

          for path in strict_files:
              payload = json.loads(path.read_text(encoding="utf-8"))
              diagnostics = payload.get("diagnostics", [])
              if payload.get("ok") is not True or diagnostics:
                  raise SystemExit(f"strict typecheck failed: {path}")

          expected_abis = {
              Path("/tmp/aegis-core-abi.json"): "ac223ea6fbf3e4bc2ec04a162391bfe166598d248ece2aa31618086b6499517b",
              Path("/tmp/aegis-helper-abi.json"): "c213636e5e5f3030198f26ada579bfa8e1376b7398f6c6044c38c23b1df61310",
          }

          for path, wanted in expected_abis.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f"{path.name} SHA256={actual}")
              if actual != wanted:
                  raise SystemExit(f"ABI SHA-256 mismatch: {path}")

          print("CANONICAL_STATIC_CERTIFICATION=PASS")
          PY

      - name: Run nine canonical Direct Mode proofs
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail

          pytest \
            -p no:cacheprovider \
            -q \
            -s \
            tests/test_aegis_core_direct.py \
            | tee /tmp/aegis-direct-mode.txt

          python - <<'PY'
          import re
          from pathlib import Path

          text = Path("/tmp/aegis-direct-mode.txt").read_text(encoding="utf-8")

          markers = (
              "R60_CASE_AUTHORITY_ACCEPT=PASS",
              "R60_CASE_FOREIGN_SENDER_REJECT=PASS",
              "R94_R9_CASE_MATCHING_SENDER_DIVERGENT_ORIGIN_ACCEPT=PASS",
              "R60_CASE_CREATOR_AGREEMENT=PASS",
              "R60_CASE_COUNTERPARTY_AGREEMENT=PASS",
              "R60_CASE_REPAIR_AGREEMENT=PASS",
              "R60_CASE_VALIDATOR_DISAGREEMENT=PASS",
              "R60_CASE_INVALID_RESULT_REJECTION=PASS",
              "R94_R13B_CASE_NONEMPTY_STACK_REJECT=PASS",
          )

          for marker in markers:
              count = text.count(marker)
              print(f"{marker} COUNT={count}")
              if count != 1:
                  raise SystemExit("runtime proof marker count mismatch: " + marker)

          if re.search(r"(^|\s)9 passed(?:\s|$)", text) is None:
              raise SystemExit("pytest did not report exactly the expected nine passing proofs")

          print("RUNTIME_PROOF_COUNT=9")
          print("CANONICAL_RUNTIME_CERTIFICATION=PASS")
          PY

  runner-realization:
    runs-on: ubuntu-latest
    env:
      GENVM_VERSION: "v0.2.16"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin pip
        run: python -m pip install --disable-pip-version-check pip==26.2.1

      - name: Install reproducible toolchain
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            -r requirements-lock.txt

      - name: Verify toolchain provenance
        run: |
          python -m pip check
          python scripts/check_toolchain_lock.py --runtime
          python scripts/check_runner_baseline.py

      - name: Download exact GenVM runner bundle
        run: genvm-lint download --version v0.2.16

      - name: Verify exact GenVM bundle
        run: |
          BUNDLE="$HOME/.cache/genvm-linter/genvm-universal-v0.2.16.tar.xz"
          test -s "$BUNDLE"
          ACTUAL="$(sha256sum "$BUNDLE" | awk '{print $1}')"
          EXPECTED="4f0b358ec98ec148be9b95cdfb0f0e1a6cbe64da0194fdfac3fffc6f5d1d93e2"
          echo "EXPECTED_BUNDLE_SHA=$EXPECTED"
          echo "ACTUAL_BUNDLE_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Run exact runner validation
        run: |
          genvm-lint check \
            verification/runner/runner-probe.py \
            --json \
            > /tmp/runner-check.json

          genvm-lint typecheck \
            verification/runner/runner-probe.py \
            --json \
            > /tmp/runner-typecheck.json

          genvm-lint schema \
            verification/runner/runner-probe.py \
            --json \
            > /tmp/runner-schema.json

      - name: Compare runner results with preserved baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pairs = (
              (
                  Path("/tmp/runner-check.json"),
                  Path("verification/runner/r5-r2-check.json"),
                  "check",
              ),
              (
                  Path("/tmp/runner-typecheck.json"),
                  Path("verification/runner/r5-r2-typecheck.json"),
                  "typecheck",
              ),
              (
                  Path("/tmp/runner-schema.json"),
                  Path("verification/runner/r5-r2-schema.json"),
                  "schema",
              ),
          )

          for actual_path, expected_path, label in pairs:
              actual = json.loads(
                  actual_path.read_text(encoding="utf-8")
              )
              expected = json.loads(
                  expected_path.read_text(encoding="utf-8")
              )

              if actual != expected:
                  raise SystemExit(
                      f"{label} result differs from preserved baseline"
                  )

              print(
                  f"RUNNER_{label.upper()}_PARITY=PASS"
              )

          print("AEGISOS_LINUX_RUNNER_REALIZATION=PASS")
          PY
