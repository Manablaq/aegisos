name: intelligent-contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify publication scope and immutable release identities
        run: |
          python scripts/check_release.py
          python scripts/check_supported_runtime_bundle.py

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD || git diff --check

  intelligent-contract-certification:
    runs-on: ubuntu-latest
    env:
      GENVM_VERSION: "v0.2.16"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin pip
        run: python -m pip install --disable-pip-version-check pip==26.2.1

      - name: Install reproducible contract toolchain
        run: |
          python -m pip install             --disable-pip-version-check             --no-input             -r requirements-lock.txt
          python -m pip check

      - name: Download certified GenVM bundle
        run: genvm-lint download --version v0.2.16

      - name: Certify AegisOS Core
        run: |
          genvm-lint lint contracts/aegis_core.py
          genvm-lint validate contracts/aegis_core.py
          genvm-lint check contracts/aegis_core.py
          genvm-lint typecheck contracts/aegis_core.py --strict
          genvm-lint schema contracts/aegis_core.py --output /tmp/aegis-core-abi.json

      - name: Certify digest helper
        run: |
          genvm-lint lint contracts/aegis_digest_helper.py
          genvm-lint validate contracts/aegis_digest_helper.py
          genvm-lint check contracts/aegis_digest_helper.py
          genvm-lint typecheck contracts/aegis_digest_helper.py --strict
          genvm-lint schema contracts/aegis_digest_helper.py --output /tmp/aegis-helper-abi.json

      - name: Run Direct Mode regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest             -p no:cacheprovider             -q             tests/test_aegis_core_direct.py
